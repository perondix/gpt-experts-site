<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">Quem faz o quê na arquitetura</title><desc id="desc">Codex desenvolve o código e usa MCP para trabalhar no Supabase. GitHub guarda o código. Vercel hospeda o app, que acessa Supabase com sessão e RLS.</desc><rect width="360" height="650" fill="#fafaf8"/>
<text x="24" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#666">DA CONSTRUÇÃO AO APP NO AR</text>
<rect x="24" y="54" width="312" height="108" rx="10" fill="#fff" stroke="#ddd"/>
<text x="42" y="84" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#222">01  Codex + sua pasta</text>
<text x="42" y="111" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Interface · regras · integração · testes</text>
<text x="42" y="138" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#666">Você orienta e revisa as mudanças.</text>
<path d="M180 163 L180 187" fill="none" stroke="#bbb"/>
<text x="164" y="185" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">↓</text>
<rect x="24" y="194" width="312" height="88" rx="10" fill="#edf4ef" stroke="#c9d9cd"/>
<text x="42" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222">02  MCP → Supabase</text>
<text x="42" y="247" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Ferramentas para o desenvolvimento.</text>
<text x="42" y="266" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555">Alvo: projeto de teste autorizado.</text>
<path d="M180 283 L180 304" fill="none" stroke="#bbb"/>
<text x="164" y="303" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">↓</text>
<rect x="24" y="313" width="312" height="76" rx="10" fill="#fff" stroke="#ddd"/>
<text x="42" y="344" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#222">03  GitHub → Vercel</text>
<text x="42" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Código versionado → build → URL</text>
<path d="M180 390 L180 412" fill="none" stroke="#bbb"/>
<text x="164" y="411" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222">↓</text>
<rect x="24" y="420" width="312" height="85" rx="10" fill="#111" stroke="#111"/>
<text x="42" y="449" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">04  Visitante usa o app</text>
<text x="42" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#ddd">Navegador + sessão autenticada</text>
<text x="165" y="531" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#222">↕</text>
<rect x="24" y="546" width="312" height="78" rx="10" fill="#fff" stroke="#ddd"/>
<text x="42" y="575" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222">Supabase em operação</text>
<text x="42" y="602" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Auth + Postgres + políticas RLS</text>
</svg>