<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-labelledby="title desc"><title id="title">Modelo de dados mínimo</title><desc id="desc">Cada usuário tem seus cartões e gastos. Um gasto só referencia um cartão do mesmo usuário. Políticas RLS restringem cada linha ao dono.</desc><rect width="360" height="590" fill="#fafaf8"/>
<text x="24" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#666">MODELO MÍNIMO DO MEU MÊS</text>
<rect x="24" y="55" width="312" height="73" rx="10" fill="#111" stroke="#111"/>
<text x="42" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Supabase Auth · usuário</text>
<text x="42" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#ddd">Identidade da pessoa autenticada</text>
<text x="166" y="153" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#222">↓</text>
<rect x="24" y="168" width="312" height="124" rx="10" fill="#fff" stroke="#ddd"/>
<text x="42" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">cards</text>
<text x="42" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#222">id · user_id · name</text>
<text x="42" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">Um apelido por cartão.</text>
<text x="42" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#666">Ex.: Cartão pessoal</text>
<text x="166" y="321" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#222">↓</text>
<rect x="24" y="337" width="312" height="151" rx="10" fill="#fff" stroke="#ddd"/>
<text x="42" y="367" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222">expenses</text>
<text x="42" y="394" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">user_id · card_id · description</text>
<text x="42" y="418" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">amount_cents · purchase_date</text>
<text x="42" y="442" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#222">reference_month · category</text>
<text x="42" y="469" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#666">id · created_at</text>
<text x="24" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#222">RLS: cada pessoa acessa suas linhas.</text>
<text x="24" y="551" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222">Constraint: gasto e cartão têm o mesmo dono.</text>
<text x="24" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#666">Autenticar não basta: autorize cada registro.</text>
</svg>